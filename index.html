<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - SIDCDI</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('img/inventario.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
    }

    .navbar {
      background-color: rgba(30, 30, 47, 0.95);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .navbar h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .navbar .nav-buttons button {
      background-color: #ffffff;
      color: #1e1e2f;
      border: none;
      padding: 0.5rem 1rem;
      margin-left: 1rem;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .navbar .nav-buttons button:hover {
      background-color: #ddd;
    }

    .content {
      height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 1px 1px 3px black;
      text-align: center;
      padding: 2rem;
    }

    .content h2 {
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <h1>SIDCDI</h1>
    <div class="nav-buttons">
      <button onclick="window.location.href='register.html'">Registro</button>
      <button onclick="window.location.href='login.php'">Login</button>
    </div>
  </div>

  <!-- CONTENIDO CENTRAL -->
  <div class="content">
    <div>
      <h2>Bienvenido al Sistema de Control de Inventario SIDCDI</h2>
      <p>Selecciona una opción en la parte superior para comenzar.</p>
    </div>
  </div>

</body>
</html>
